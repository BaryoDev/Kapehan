name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
        type: string

# id-token: write is what npm exchanges for a registry credential. There is no
# NPM_TOKEN: this package publishes through npm trusted publishing (OIDC).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url on purpose. setup-node would write an .npmrc line pinning
      # _authToken to an empty NODE_AUTH_TOKEN, and registry.npmjs.org is the default
      # anyway. Trusted publishing wants no token in the file.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # Trusted publishing needs npm 11.5.1 or later, and Node 22.x still ships npm 10.
      - name: Use an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Set version
        if: github.event_name == 'workflow_dispatch'
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      # A release tagged v0.3.0 that publishes 0.2.0 is the failure this catches.
      # npm accepts it, and the tag and the registry then disagree forever.
      - name: Tag must match package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # prepublishOnly runs this too, but failing here keeps a broken build
      # out of the publish step rather than half way through it.
      - name: Check generated files are in sync
        run: npm test

      # Provenance is generated automatically under trusted publishing, so there is
      # no --provenance flag and no publishConfig.provenance.
      - name: Publish
        run: npm publish
